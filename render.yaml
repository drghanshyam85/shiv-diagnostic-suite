# Render blueprint — web service with a persistent disk for the database and uploaded files.
# Dashboard → New → Blueprint → select this repository. Patient data never leaves the disk / your DB.
services:
  - type: web
    name: ssdc-clinic-suite
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node --no-warnings server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_DATA
        value: "false"
    disk:
      name: ssdc-data
      mountPath: /var/data
      sizeGB: 5
